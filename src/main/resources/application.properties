# ====================================================================
# Smart Campus Placement & Drive Management Portal
# Primary Configuration (MySQL with Schema & Data Auto-population)
# ====================================================================

server.port=8080
spring.application.name=Smart-Placement-Portal

# --------------------------------------------------------------------
# 1. Primary MySQL Database Configuration
# --------------------------------------------------------------------
spring.datasource.url=jdbc:mysql://localhost:3306/placement_db?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC
spring.datasource.username=root
spring.datasource.password=root
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# --------------------------------------------------------------------
# 2. Spring Data JPA & Hibernate Configuration
# --------------------------------------------------------------------
spring.jpa.database-platform=org.hibernate.dialect.MySQLDialect
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.highlight_sql=true
spring.jpa.open-in-view=false

# --------------------------------------------------------------------
# 3. SQL Initialization (Loads schema.sql and data.sql)
# --------------------------------------------------------------------
spring.sql.init.mode=always
spring.jpa.defer-datasource-initialization=true
spring.sql.init.continue-on-error=true

# --------------------------------------------------------------------
# 4. Optional: To quickly run on H2 In-Memory without a local MySQL server:
# Launch with: --spring.profiles.active=h2
# Or uncomment the H2 properties in application-h2.properties
# --------------------------------------------------------------------
