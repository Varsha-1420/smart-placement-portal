# ====================================================================
# Smart Campus Placement Portal - H2 In-Memory Fallback Profile
# Use this profile for instant local development without MySQL installed:
# Run: mvn spring-boot:run -Dspring-boot.run.profiles=h2
# ====================================================================

spring.datasource.url=jdbc:h2:mem:placement_db;DB_CLOSE_DELAY=-1;MODE=MySQL
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

# H2 Web Console available at http://localhost:8080/h2-console
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console
spring.h2.console.settings.web-allow-others=true

spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.jpa.hibernate.ddl-auto=none
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# Schema and data loading
spring.sql.init.mode=always
spring.jpa.defer-datasource-initialization=true
spring.sql.init.continue-on-error=true
